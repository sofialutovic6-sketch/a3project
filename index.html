<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drift — pointer instrument</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">A3 / POINTER INSTRUMENT</p>
      <h1>Drift</h1>
      <p>Press and drag to make sound. Move higher for a higher note; move faster for a brighter, louder sound.</p>
    </header>

    <section id="pad" aria-label="Interactive sound area">
      <div id="cursor" aria-hidden="true"></div>
      <span id="hint">Press and drag here</span>
    </section>

    <footer>
      <span id="status" role="status">Ready</span>
      <span>Mouse · touch · pen</span>
    </footer>
  </main>
</body>
</html>
